# Help: `topgrade --config-reference` (displays https://github.com/topgrade-rs/topgrade/blob/main/config.example.toml)

[misc]
  assume_yes = true
  cleanup = true
  disable = [
    "containers",
    "cursor_agent",
    "git_repos",
    "node",
    "pnpm",
    "ruby_gems",
    "skills",
    "system",
    "uv",
    "yarn",
  ]
  display_time = false

[commands]
  # Browser sessions expire. Ask before continuing, instead of the built-in step.
  "Cursor Agent" = "$HOME/.dotfiles/bin/cursor-agent-update"
  "Skills" = 'cd "$HOME" && npx --yes skills update --global'
  "npm" = 'cd "$HOME" && npm update --location global --allow-remote=all'
